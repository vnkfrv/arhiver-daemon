# Два сервиса на ОДНОМ образе + nginx перед ботом:
#   talk-daemon — архивирует записи (ffmpeg + ASR + LLM + БД + удаление);
#   talk-bot    — интерактивный бот Tag (кнопки/модалка/выдача файлов, алерты админам);
#   talk-nginx  — HTTPS на 443: принимает нажатия кнопок от Tag и передаёт их боту.
# Общие тома: data (SQLite-БД), Transcripts (файлы расшифровок), logs.
# Первый прогон — с SEND_TO_TAG=0 в .env (наполнить архивы, никому не слать).

# Вывод контейнеров (docker logs) Docker по умолчанию копит без ограничений, а оба сервиса пишут
# туда всё, что и в logs/. Ограничиваем: не больше 3 файлов по 50 МБ на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  talk-daemon:
    build: .
    image: talk-archiver-nikiforov:latest
    container_name: talk-daemon-nikiforov
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    command: python main.py
    volumes:
      - ./data:/app/data                 # SQLite-БД (общая с ботом)
      - ./Transcripts:/app/Transcripts   # расшифровки/выжимки
      - ./logs:/app/logs

  talk-bot:
    image: talk-archiver-nikiforov:latest   # тот же образ, что собрал talk-daemon
    container_name: talk-bot-nikiforov
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    command: python bot.py
    depends_on:
      - talk-daemon
    # /health отвечает, пока жив HTTP-сервер бота. Зависший бот получит статус unhealthy в
    # `docker compose ps`, но сам Docker такой контейнер НЕ перезапускает — restart срабатывает
    # только при выходе процесса. (Демону healthcheck не ставим: в простое между окнами он молчит.)
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('BUTTON_PORT','8081')+'/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      # Наружу бота не публикуем: нажатия от Tag приходят через talk-nginx (443). Этот порт —
      # только для проверки с самой ВМ: curl http://127.0.0.1:${BOT_HOST_PORT}/health
      - "127.0.0.1:${BOT_HOST_PORT:-8081}:${BUTTON_PORT:-8081}"
    volumes:
      - ./data:/app/data                 # та же БД, что у демона
      - ./Transcripts:/app/Transcripts   # те же файлы (бот отдаёт их в Tag)
      - ./logs:/app/logs

  talk-nginx:
    image: nginx:1.27-alpine
    container_name: talk-nginx-nikiforov
    restart: unless-stopped
    logging: *logging
    depends_on:
      - talk-bot
    ports:
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/talk-bot.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
