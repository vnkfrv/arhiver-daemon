# nginx перед ботом: принимает нажатия кнопок и отправку окон от Tag по HTTPS на 443 и передаёт
# их боту (talk-bot:8081) внутри сети docker compose. Наружу открыт только 443 — сам бот на ВМ
# слушает лишь 127.0.0.1.
#
# Сертификат и ключ кладутся на ВМ в nginx/certs/ (в git их нет): bot.crt — сертификат вместе с
# цепочкой промежуточных, bot.key — ключ. Сертификат должен быть выдан на имя (или IP) из
# BOT_PUBLIC_URL, и Tag должен ему доверять — см. DEPLOY.md.

# В адресе кнопок есть секрет (?t=…): в журнал запросов пишем путь БЕЗ параметров.
log_format talkbot '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                   '$request_time';

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/bot.crt;
    ssl_certificate_key /etc/nginx/certs/bot.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /dev/stdout talkbot;
    client_max_body_size 1m;          # нажатия и формы — это маленькие JSON

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # пропускаем только то, что умеет бот; остальное — 404
    location = /action { proxy_pass http://talk-bot:8081; }
    location = /dialog { proxy_pass http://talk-bot:8081; }
    location = /health { proxy_pass http://talk-bot:8081; }
    location / { return 404; }
}
